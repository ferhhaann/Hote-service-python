version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: hotel-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hotel_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - hotel-network

  api:
    build: .
    container_name: hotel-api
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - SECRET_KEY=80a3c5a8115fd2325b2583d26e6d57f48720c4e1ea01f82449b3ae2aa29a3eee
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=hotel_db
    depends_on:
      - mongodb
    volumes:
      - ./app:/app/app
    networks:
      - hotel-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongodb_data:

networks:
  hotel-network:
    driver: bridge
